<!-- api/templates/api/register.html -->
{% extends 'api/base.html' %}

{% block title %}注册{% endblock %}

{% block content %}
<h2>注册</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">注册</button>
</form>
<p>已有账号？<a href="{% url 'login' %}">登录</a></p>
{% endblock %}
